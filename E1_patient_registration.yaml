openapi: 3.0.0
info:
  title: RIS API - Epic E1 Patient Registration, Referral Management & Appointment Setup
  version: 1.2.0
  description: OpenAPI contract for Epic E1 covering Patient, Referrer, Clinic, Exam, Referral and Appointment setup workflows

servers:
  - url: http://localhost:4010
    description: Prism mock server

tags:
  - name: Patient Registration
  - name: Referrer Management
  - name: Referral Management
  - name: Appointment Scheduling
  - name: Reference Data

paths:
  /api/v1/patients:
    post:
      tags:
        - Patient Registration
      summary: Create Patient
      description: Create a new patient record with demographic, contact, address, emergency contact, insurance and preference information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
            example:
              identity:
                firstName: John
                middleName: Michael
                lastName: Doe
                previousName: Smith
                dob: "1980-01-01"
                gender: Male
                genderAtBirth: Male
                maritalStatus: Married
                occupation: Accountant
                ethnicity: Australian
              identifiers:
                medicareNumber: "1234567890"
                myhrNumber: "MYHR-1001"
                pacsId: "PACS-1001"
              insurance:
                privateInsuranceNumber: "PI-778899"
                privateInsuranceProvider: Bupa
              contactDetails:
                homePhone: "0391112222"
                officePhone: "0381112222"
                mobilePhone: "0400000000"
                otherPhone: "0411222333"
                otherPhoneType: Work Mobile
                email: "john.doe@email.com"
                alternateEmail: "john.alt@email.com"
                preferredModeOfContact: Mobile
                preferredContactNumber: "0400000000"
              address:
                addressLine1: "10 Main Street"
                addressLine2: "Apartment 4"
                addressLine3: null
                state: VIC
                postcode: "3000"
              emergencyContact:
                firstName: Jane
                lastName: Doe
                relationship: Spouse
                homePhone: null
                officePhone: "0398765432"
                mobilePhone: "0411111111"
              clinicalAdministrativeInfo:
                allergies: Penicillin
                bookingPreference: Morning appointments preferred
                genericNotes: Requires wheelchair access
                consent: true
              systemInfo:
                smsHistory:
                  - "2026-03-23T09:00:00Z - Registration SMS sent"
      responses:
        '200':
          description: Patient created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  patient:
                    patientId: 1001
                    identity:
                      firstName: John
                      middleName: Michael
                      lastName: Doe
                      previousName: Smith
                      dob: "1980-01-01"
                      gender: Male
                      genderAtBirth: Male
                      maritalStatus: Married
                      occupation: Accountant
                      ethnicity: Australian
                    identifiers:
                      medicareNumber: "1234567890"
                      myhrNumber: "MYHR-1001"
                      pacsId: "PACS-1001"
                    insurance:
                      privateInsuranceNumber: "PI-778899"
                      privateInsuranceProvider: Bupa
                    contactDetails:
                      homePhone: "0391112222"
                      officePhone: "0381112222"
                      mobilePhone: "0400000000"
                      otherPhone: "0411222333"
                      otherPhoneType: Work Mobile
                      email: "john.doe@email.com"
                      alternateEmail: "john.alt@email.com"
                      preferredModeOfContact: Mobile
                      preferredContactNumber: "0400000000"
                    address:
                      addressLine1: "10 Main Street"
                      addressLine2: "Apartment 4"
                      addressLine3: null
                      state: VIC
                      postcode: "3000"
                    emergencyContact:
                      firstName: Jane
                      lastName: Doe
                      relationship: Spouse
                      homePhone: null
                      officePhone: "0398765432"
                      mobilePhone: "0411111111"
                    clinicalAdministrativeInfo:
                      allergies: Penicillin
                      bookingPreference: Morning appointments preferred
                      genericNotes: Requires wheelchair access
                      consent: true
                    systemInfo:
                      smsHistory:
                        - "2026-03-23T09:00:00Z - Registration SMS sent"
                      isDeleted: false
                      deletedAt: null
                      deletedBy: null
                errorMessage: null
                validationErrors: null
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: false
                data: null
                errorMessage: Validation failed
                validationErrors:
                  identity.firstName: First name is required
                  identity.lastName: Last name is required
                  identity.dob: Date of birth is required
                  contactDetails.mobilePhone: Mobile phone is required

  /api/v1/patients/{patientId}:
    get:
      tags:
        - Patient Registration
      summary: Get Patient Details
      description: Retrieve a patient record by patient ID
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Patient retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  patient:
                    patientId: 1001
                    identity:
                      firstName: John
                      middleName: Michael
                      lastName: Doe
                      previousName: Smith
                      dob: "1980-01-01"
                      gender: Male
                      genderAtBirth: Male
                      maritalStatus: Married
                      occupation: Accountant
                      ethnicity: Australian
                    identifiers:
                      medicareNumber: "1234567890"
                      myhrNumber: "MYHR-1001"
                      pacsId: "PACS-1001"
                    insurance:
                      privateInsuranceNumber: "PI-778899"
                      privateInsuranceProvider: Bupa
                    contactDetails:
                      homePhone: "0391112222"
                      officePhone: "0381112222"
                      mobilePhone: "0400000000"
                      otherPhone: "0411222333"
                      otherPhoneType: Work Mobile
                      email: "john.doe@email.com"
                      alternateEmail: "john.alt@email.com"
                      preferredModeOfContact: Mobile
                      preferredContactNumber: "0400000000"
                    address:
                      addressLine1: "10 Main Street"
                      addressLine2: "Apartment 4"
                      addressLine3: null
                      state: VIC
                      postcode: "3000"
                    emergencyContact:
                      firstName: Jane
                      lastName: Doe
                      relationship: Spouse
                      homePhone: null
                      officePhone: "0398765432"
                      mobilePhone: "0411111111"
                    clinicalAdministrativeInfo:
                      allergies: Penicillin
                      bookingPreference: Morning appointments preferred
                      genericNotes: Requires wheelchair access
                      consent: true
                    systemInfo:
                      smsHistory:
                        - "2026-03-23T09:00:00Z - Registration SMS sent"
                      isDeleted: false
                      deletedAt: null
                      deletedBy: null
                errorMessage: null
                validationErrors: null
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: false
                data: null
                errorMessage: Patient not found
                validationErrors: null

    put:
      tags:
        - Patient Registration
      summary: Update Patient
      description: Update patient demographic, contact, insurance, emergency and preference information
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
            example:
              identity:
                previousName: Smith
                maritalStatus: Married
                occupation: Accountant
                ethnicity: Australian
              identifiers:
                pacsId: "PACS-1001"
              insurance:
                privateInsuranceNumber: "PI-123456"
                privateInsuranceProvider: Medibank
              contactDetails:
                mobilePhone: "0412345678"
                email: "john.updated@email.com"
                alternateEmail: "john.secondary@email.com"
                preferredModeOfContact: Email
                preferredContactNumber: "0412345678"
              address:
                addressLine1: "25 Collins Street"
                addressLine2: "Level 2"
                addressLine3: null
                state: VIC
                postcode: "3000"
              emergencyContact:
                firstName: Jane
                lastName: Doe
                relationship: Spouse
                homePhone: null
                officePhone: null
                mobilePhone: "0422222222"
              clinicalAdministrativeInfo:
                allergies: Penicillin, Latex
                bookingPreference: Afternoon appointments preferred
                genericNotes: Interpreter may be required
                consent: true
      responses:
        '200':
          description: Patient updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  patient:
                    patientId: 1001
                    contactDetails:
                      mobilePhone: "0412345678"
                      email: "john.updated@email.com"
                      alternateEmail: "john.secondary@email.com"
                      preferredModeOfContact: Email
                      preferredContactNumber: "0412345678"
                    address:
                      addressLine1: "25 Collins Street"
                      addressLine2: "Level 2"
                      state: VIC
                      postcode: "3000"
                    clinicalAdministrativeInfo:
                      allergies: Penicillin, Latex
                      bookingPreference: Afternoon appointments preferred
                      genericNotes: Interpreter may be required
                      consent: true
                errorMessage: null
                validationErrors: null
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: false
                data: null
                errorMessage: Validation failed
                validationErrors:
                  contactDetails.email: Invalid email format

    delete:
      tags:
        - Patient Registration
      summary: Soft Delete Patient
      description: Soft delete a patient by marking the record as deleted without permanently removing it from the database
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Patient soft deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  patient:
                    patientId: 1001
                    isDeleted: true
                    deletedAt: "2026-03-23T10:30:00Z"
                    deletedBy: "admin01"
                    message: Patient record soft deleted successfully
                errorMessage: null
                validationErrors: null
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: false
                data: null
                errorMessage: Patient not found
                validationErrors: null

  /api/v1/patients/search:
    get:
      tags:
        - Patient Registration
      summary: Search Patients
      description: Search patients by patient ID, name, Medicare number, MyHR number, mobile or email. Soft deleted patients are excluded by default.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Search completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  patients:
                    - patientId: 1001
                      identity:
                        firstName: John
                        middleName: Michael
                        lastName: Doe
                        dob: "1980-01-01"
                      identifiers:
                        medicareNumber: "1234567890"
                        myhrNumber: "MYHR-1001"
                        pacsId: "PACS-1001"
                      contactDetails:
                        mobilePhone: "0400000000"
                        email: "john.doe@email.com"
                      systemInfo:
                        isDeleted: false
                errorMessage: null
                validationErrors: null
        '400':
          description: Search query missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: false
                data: null
                errorMessage: Validation failed
                validationErrors:
                  query: Search query is required

  /api/v1/patients/duplicate-check:
    post:
      tags:
        - Patient Registration
      summary: Check Duplicate Patient
      description: Check for possible duplicate patient records using name, date of birth, mobile and Medicare number
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateCheckRequest'
            example:
              firstName: John
              middleName: Michael
              lastName: Doe
              dob: "1980-01-01"
              mobilePhone: "0400000000"
              medicareNumber: "1234567890"
      responses:
        '200':
          description: Duplicate check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  isDuplicate: true
                  matchedPatients:
                    - patientId: 1001
                      identity:
                        firstName: John
                        lastName: Doe
                        dob: "1980-01-01"
                      identifiers:
                        medicareNumber: "1234567890"
                      contactDetails:
                        mobilePhone: "0400000000"
                errorMessage: null
                validationErrors: null

  /api/v1/patients/{patientId}/medicare/verify:
    post:
      tags:
        - Patient Registration
      summary: Verify Medicare
      description: Verify Medicare details for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Medicare verification completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  medicareVerification:
                    patientId: 1001
                    medicareNumber: "1234567890"
                    isValid: true
                    verifiedAt: "2026-03-23T10:15:00Z"
                errorMessage: null
                validationErrors: null
        '400':
          description: Invalid patient ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: false
                data: null
                errorMessage: Invalid patient ID
                validationErrors: null

  /api/v1/referrers:
    post:
      tags:
        - Referrer Management
      summary: Create Referrer
      description: Create a referrer record including specialty, provider numbers, practice locations and report delivery preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReferrerRequest'
            example:
              identity:
                firstName: Sarah
                middleName: Anne
                lastName: Smith
                dob: "1975-02-15"
                gender: Female
              contactDetails:
                mobilePhone: "0413000000"
                notes: Prefers urgent calls to mobile
              professionalDetails:
                specialty: Cardiology
              practiceLocations:
                - locationName: HeartCare Clinic
                  providerNumber: "PRV-001"
                  addressLine1: "100 Collins Street"
                  addressLine2: "Suite 12"
                  addressLine3: null
                  state: VIC
                  postcode: "3000"
                  practicePhone: "0399990000"
                  practiceAdditionalPhone: "0399990001"
                  practiceFax: "0399990002"
                  practiceManagerName: Lisa Brown
                  practiceManagerPhone: "0400123456"
              reportDeliveryPreferences:
                - Electronic
                - Email
      responses:
        '200':
          description: Referrer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  referrer:
                    referrerId: 5001
                    identity:
                      firstName: Sarah
                      middleName: Anne
                      lastName: Smith
                      dob: "1975-02-15"
                      gender: Female
                    contactDetails:
                      mobilePhone: "0413000000"
                      notes: Prefers urgent calls to mobile
                    professionalDetails:
                      specialty: Cardiology
                    practiceLocations:
                      - locationName: HeartCare Clinic
                        providerNumber: "PRV-001"
                        addressLine1: "100 Collins Street"
                        addressLine2: "Suite 12"
                        addressLine3: null
                        state: VIC
                        postcode: "3000"
                        practicePhone: "0399990000"
                        practiceAdditionalPhone: "0399990001"
                        practiceFax: "0399990002"
                        practiceManagerName: Lisa Brown
                        practiceManagerPhone: "0400123456"
                    reportDeliveryPreferences:
                      - Electronic
                      - Email
                errorMessage: null
                validationErrors: null

  /api/v1/referrers/{referrerId}:
    get:
      tags:
        - Referrer Management
      summary: Get Referrer Details
      description: Retrieve referrer by ID
      security:
        - bearerAuth: []
      parameters:
        - name: referrerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Referrer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  referrer:
                    referrerId: 5001
                    identity:
                      firstName: Sarah
                      middleName: Anne
                      lastName: Smith
                      dob: "1975-02-15"
                      gender: Female
                    contactDetails:
                      mobilePhone: "0413000000"
                      notes: Prefers urgent calls to mobile
                    professionalDetails:
                      specialty: Cardiology
                    practiceLocations:
                      - locationName: HeartCare Clinic
                        providerNumber: "PRV-001"
                        addressLine1: "100 Collins Street"
                        addressLine2: "Suite 12"
                        addressLine3: null
                        state: VIC
                        postcode: "3000"
                        practicePhone: "0399990000"
                        practiceAdditionalPhone: "0399990001"
                        practiceFax: "0399990002"
                        practiceManagerName: Lisa Brown
                        practiceManagerPhone: "0400123456"
                    reportDeliveryPreferences:
                      - Electronic
                      - Email
                errorMessage: null
                validationErrors: null
        '404':
          description: Referrer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: false
                data: null
                errorMessage: Referrer not found
                validationErrors: null

  /api/v1/referrals:
    post:
      tags:
        - Referral Management
      summary: Create Referral
      description: Create a referral linking a patient, referrer, clinic and requested examination
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReferralRequest'
            example:
              patientId: 1001
              referrerId: 5001
              clinicId: 7001
              examId: 8001
              referralType: Specialist
              referralDate: "2026-03-23"
              clinicalNotes: Cardiology review requested
      responses:
        '200':
          description: Referral created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  referral:
                    referralId: 2001
                    patientId: 1001
                    referrerId: 5001
                    clinicId: 7001
                    examId: 8001
                    referralType: Specialist
                    referralDate: "2026-03-23"
                    clinicalNotes: Cardiology review requested
                    status: Active
                errorMessage: null
                validationErrors: null

  /api/v1/referrals/{referralId}:
    get:
      tags:
        - Referral Management
      summary: Get Referral Details
      description: Retrieve a referral by ID
      security:
        - bearerAuth: []
      parameters:
        - name: referralId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Referral retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  referral:
                    referralId: 2001
                    patientId: 1001
                    referrerId: 5001
                    clinicId: 7001
                    examId: 8001
                    referralType: Specialist
                    referralDate: "2026-03-23"
                    clinicalNotes: Cardiology review requested
                    status: Active
                errorMessage: null
                validationErrors: null
        '404':
          description: Referral not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: false
                data: null
                errorMessage: Referral not found
                validationErrors: null

  /api/v1/referrals/{referralId}/documents:
    post:
      tags:
        - Referral Management
      summary: Upload Referral Document
      description: Upload a document linked to a referral
      security:
        - bearerAuth: []
      parameters:
        - name: referralId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
            example:
              fileName: referral_letter.pdf
              fileType: pdf
              documentType: Referral Letter
      responses:
        '200':
          description: Referral document uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  document:
                    documentId: 3001
                    referralId: 2001
                    fileName: referral_letter.pdf
                    fileType: pdf
                    documentType: Referral Letter
                errorMessage: null
                validationErrors: null

  /api/v1/referrals/{referralId}/link:
    post:
      tags:
        - Referral Management
      summary: Link Referral to Patient
      description: Link an existing referral to a patient record
      security:
        - bearerAuth: []
      parameters:
        - name: referralId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkReferralRequest'
            example:
              patientId: 1001
      responses:
        '200':
          description: Referral linked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  referral:
                    referralId: 2001
                    patientId: 1001
                    linked: true
                errorMessage: null
                validationErrors: null

  /api/v1/reference/clinics:
    get:
      tags:
        - Reference Data
      summary: Get Clinics
      description: Retrieve clinic and practice reference data used for referral and appointment setup
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clinics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  clinics:
                    - clinicId: 7001
                      companyPracticeName: Benchmark Radiology
                      clinicName: Hillside
                      addressLine1: "50 Main Road"
                      addressLine2: null
                      addressLine3: null
                      state: VIC
                      postcode: "3037"
                      googleMapsLink: "https://maps.google.com/?q=Benchmark+Radiology+Hillside"
                      practicePhone: "0391234567"
                      practiceFax: "0391234568"
                      practiceManagerName: Emma Green
                      practiceManagerPhone: "0400555666"
                      practiceManagerMobile: "0411222333"
                      lspn: "LSPN-1234"
                      approvedModalities:
                        - XRAY
                        - US
                        - CT
                errorMessage: null
                validationErrors: null

  /api/v1/reference/exams:
    get:
      tags:
        - Reference Data
      summary: Get Examination Library
      description: Retrieve examination library reference data for appointment setup
      security:
        - bearerAuth: []
      parameters:
        - name: modality
          in: query
          required: false
          schema:
            type: string
        - name: clinicId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Examination library retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  exams:
                    - examId: 8001
                      modality: US
                      examinationType: Cardiac
                      bodyPart: Chest
                      contrastRequired: false
                      equipmentRequirement: Ultrasound - General
                      practiceCode: US-CARD-001
                      associableExaminations:
                        - US Doppler
                      medicareItemNumber: "55113"
                      medicareRebateFee: 120.0
                      outOfPocketFee: 40.0
                      privateBillingFee: 160.0
                      preparationArrivalTime: Arrive 15 minutes early
                      smsContentRules: Bring previous cardiac reports
                      postProcedureInstructions: Resume normal activities
                errorMessage: null
                validationErrors: null

  /api/v1/appointments/slots:
    get:
      tags:
        - Appointment Scheduling
      summary: Get Available Appointment Slots
      description: Retrieve available appointment slots by clinic, date and modality
      security:
        - bearerAuth: []
      parameters:
        - name: clinicId
          in: query
          required: false
          schema:
            type: integer
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: modality
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Slots retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  slots:
                    - clinicId: 7001
                      clinicName: Hillside
                      date: "2026-03-24"
                      time: "09:00"
                      modality: US
                    - clinicId: 7001
                      clinicName: Hillside
                      date: "2026-03-24"
                      time: "09:30"
                      modality: US
                errorMessage: null
                validationErrors: null

  /api/v1/appointments:
    post:
      tags:
        - Appointment Scheduling
      summary: Create Appointment
      description: Create an appointment linked to patient, referral, clinic and exam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
            example:
              patientId: 1001
              referralId: 2001
              clinicId: 7001
              examId: 8001
              appointmentDate: "2026-03-24"
              appointmentTime: "09:00"
              bookingNotes: Patient prefers early appointments
      responses:
        '200':
          description: Appointment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  appointment:
                    appointmentId: 4001
                    patientId: 1001
                    referralId: 2001
                    clinicId: 7001
                    examId: 8001
                    appointmentDate: "2026-03-24"
                    appointmentTime: "09:00"
                    bookingNotes: Patient prefers early appointments
                    status: Booked
                errorMessage: null
                validationErrors: null

  /api/v1/appointments/{appointmentId}:
    put:
      tags:
        - Appointment Scheduling
      summary: Update Appointment
      description: Update or reschedule an appointment
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentRequest'
            example:
              appointmentDate: "2026-03-25"
              appointmentTime: "10:30"
              bookingNotes: Rescheduled due to patient request
      responses:
        '200':
          description: Appointment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  appointment:
                    appointmentId: 4001
                    appointmentDate: "2026-03-25"
                    appointmentTime: "10:30"
                    bookingNotes: Rescheduled due to patient request
                    status: Rescheduled
                errorMessage: null
                validationErrors: null

  /api/v1/appointments/{appointmentId}/pre-study-form:
    post:
      tags:
        - Appointment Scheduling
      summary: Submit Pre-Study Form
      description: Submit patient pre-study form details before the study is performed
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreStudyFormRequest'
            example:
              consent: true
              allergies: Penicillin
              notes: Patient requires assistance
      responses:
        '200':
          description: Pre-study form saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  preStudyForm:
                    appointmentId: 4001
                    submitted: true
                errorMessage: null
                validationErrors: null

  /api/v1/appointments/{appointmentId}/notifications:
    post:
      tags:
        - Appointment Scheduling
      summary: Send Appointment Notification
      description: Send an appointment notification to a patient using the preferred contact channel
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notification sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                data:
                  notification:
                    appointmentId: 4001
                    channel: SMS
                    sent: true
                errorMessage: null
                validationErrors: null

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DefaultResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        errorMessage:
          type: string
          nullable: true
        validationErrors:
          type: object
          nullable: true

    CreatePatientRequest:
      type: object
      required:
        - identity
        - contactDetails
        - address
      properties:
        identity:
          $ref: '#/components/schemas/PatientIdentity'
        identifiers:
          $ref: '#/components/schemas/PatientIdentifiers'
        insurance:
          $ref: '#/components/schemas/PatientInsurance'
        contactDetails:
          $ref: '#/components/schemas/PatientContactDetails'
        address:
          $ref: '#/components/schemas/PatientAddress'
        emergencyContact:
          $ref: '#/components/schemas/PatientEmergencyContact'
        clinicalAdministrativeInfo:
          $ref: '#/components/schemas/PatientClinicalAdministrativeInfo'
        systemInfo:
          $ref: '#/components/schemas/PatientSystemInfo'

    UpdatePatientRequest:
      type: object
      properties:
        identity:
          type: object
          properties:
            previousName:
              type: string
              nullable: true
            gender:
              type: string
              nullable: true
            genderAtBirth:
              type: string
              nullable: true
            maritalStatus:
              type: string
              nullable: true
            occupation:
              type: string
              nullable: true
            ethnicity:
              type: string
              nullable: true
        identifiers:
          type: object
          properties:
            medicareNumber:
              type: string
              nullable: true
            myhrNumber:
              type: string
              nullable: true
            pacsId:
              type: string
              nullable: true
        insurance:
          $ref: '#/components/schemas/PatientInsurance'
        contactDetails:
          $ref: '#/components/schemas/PatientContactDetails'
        address:
          $ref: '#/components/schemas/PatientAddress'
        emergencyContact:
          $ref: '#/components/schemas/PatientEmergencyContact'
        clinicalAdministrativeInfo:
          $ref: '#/components/schemas/PatientClinicalAdministrativeInfo'

    PatientIdentity:
      type: object
      required:
        - firstName
        - lastName
        - dob
      properties:
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
        lastName:
          type: string
        previousName:
          type: string
          nullable: true
        dob:
          type: string
          format: date
        gender:
          type: string
          nullable: true
        genderAtBirth:
          type: string
          nullable: true
        maritalStatus:
          type: string
          nullable: true
        occupation:
          type: string
          nullable: true
        ethnicity:
          type: string
          nullable: true

    PatientIdentifiers:
      type: object
      properties:
        medicareNumber:
          type: string
          nullable: true
        myhrNumber:
          type: string
          nullable: true
        pacsId:
          type: string
          nullable: true

    PatientInsurance:
      type: object
      properties:
        privateInsuranceNumber:
          type: string
          nullable: true
        privateInsuranceProvider:
          type: string
          nullable: true

    PatientContactDetails:
      type: object
      properties:
        homePhone:
          type: string
          nullable: true
        officePhone:
          type: string
          nullable: true
        mobilePhone:
          type: string
          nullable: true
        otherPhone:
          type: string
          nullable: true
        otherPhoneType:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        alternateEmail:
          type: string
          format: email
          nullable: true
        preferredModeOfContact:
          type: string
          nullable: true
        preferredContactNumber:
          type: string
          nullable: true

    PatientAddress:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        addressLine3:
          type: string
          nullable: true
        state:
          type: string
        postcode:
          type: string

    PatientEmergencyContact:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        relationship:
          type: string
        homePhone:
          type: string
          nullable: true
        officePhone:
          type: string
          nullable: true
        mobilePhone:
          type: string
          nullable: true

    PatientClinicalAdministrativeInfo:
      type: object
      properties:
        allergies:
          type: string
          nullable: true
        bookingPreference:
          type: string
          nullable: true
        genericNotes:
          type: string
          nullable: true
        consent:
          type: boolean
          nullable: true

    PatientSystemInfo:
      type: object
      properties:
        smsHistory:
          type: array
          items:
            type: string
        isDeleted:
          type: boolean
          default: false
        deletedAt:
          type: string
          format: date-time
          nullable: true
        deletedBy:
          type: string
          nullable: true

    DuplicateCheckRequest:
      type: object
      properties:
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
        lastName:
          type: string
        dob:
          type: string
          format: date
        mobilePhone:
          type: string
          nullable: true
        medicareNumber:
          type: string
          nullable: true

    CreateReferrerRequest:
      type: object
      required:
        - identity
        - professionalDetails
      properties:
        identity:
          $ref: '#/components/schemas/ReferrerIdentity'
        contactDetails:
          $ref: '#/components/schemas/ReferrerContactDetails'
        professionalDetails:
          $ref: '#/components/schemas/ReferrerProfessionalDetails'
        practiceLocations:
          type: array
          items:
            $ref: '#/components/schemas/ReferrerPracticeLocation'
        reportDeliveryPreferences:
          type: array
          items:
            type: string
            enum:
              - Electronic
              - Email
              - Fax
              - Hand Delivery to Patient

    ReferrerIdentity:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
        lastName:
          type: string
        dob:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          nullable: true

    ReferrerContactDetails:
      type: object
      properties:
        mobilePhone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    ReferrerProfessionalDetails:
      type: object
      properties:
        specialty:
          type: string
          nullable: true

    ReferrerPracticeLocation:
      type: object
      properties:
        locationName:
          type: string
        providerNumber:
          type: string
          nullable: true
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        addressLine3:
          type: string
          nullable: true
        state:
          type: string
        postcode:
          type: string
        practicePhone:
          type: string
          nullable: true
        practiceAdditionalPhone:
          type: string
          nullable: true
        practiceFax:
          type: string
          nullable: true
        practiceManagerName:
          type: string
          nullable: true
        practiceManagerPhone:
          type: string
          nullable: true

    CreateReferralRequest:
      type: object
      required:
        - patientId
        - referrerId
        - clinicId
        - examId
        - referralType
      properties:
        patientId:
          type: integer
        referrerId:
          type: integer
        clinicId:
          type: integer
        examId:
          type: integer
        referralType:
          type: string
        referralDate:
          type: string
          format: date
        clinicalNotes:
          type: string
          nullable: true

    UploadDocumentRequest:
      type: object
      required:
        - fileName
        - fileType
      properties:
        fileName:
          type: string
        fileType:
          type: string
        documentType:
          type: string
          nullable: true

    LinkReferralRequest:
      type: object
      required:
        - patientId
      properties:
        patientId:
          type: integer

    CreateAppointmentRequest:
      type: object
      required:
        - patientId
        - referralId
        - clinicId
        - examId
        - appointmentDate
        - appointmentTime
      properties:
        patientId:
          type: integer
        referralId:
          type: integer
        clinicId:
          type: integer
        examId:
          type: integer
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
        bookingNotes:
          type: string
          nullable: true

    UpdateAppointmentRequest:
      type: object
      properties:
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
        bookingNotes:
          type: string
          nullable: true

    PreStudyFormRequest:
      type: object
      properties:
        consent:
          type: boolean
        allergies:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    Clinic:
      type: object
      properties:
        clinicId:
          type: integer
        companyPracticeName:
          type: string
        clinicName:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        addressLine3:
          type: string
          nullable: true
        state:
          type: string
        postcode:
          type: string
        googleMapsLink:
          type: string
          nullable: true
        practicePhone:
          type: string
          nullable: true
        practiceFax:
          type: string
          nullable: true
        practiceManagerName:
          type: string
          nullable: true
        practiceManagerPhone:
          type: string
          nullable: true
        practiceManagerMobile:
          type: string
          nullable: true
        lspn:
          type: string
          nullable: true
        approvedModalities:
          type: array
          items:
            type: string

    Exam:
      type: object
      properties:
        examId:
          type: integer
        modality:
          type: string
        examinationType:
          type: string
        bodyPart:
          type: string
          nullable: true
        contrastRequired:
          type: boolean
        equipmentRequirement:
          type: string
          nullable: true
        practiceCode:
          type: string
          nullable: true
        associableExaminations:
          type: array
          items:
            type: string
        medicareItemNumber:
          type: string
          nullable: true
        medicareRebateFee:
          type: number
          format: float
          nullable: true
        outOfPocketFee:
          type: number
          format: float
          nullable: true
        privateBillingFee:
          type: number
          format: float
          nullable: true
        medicareAdditionalNumberExclusion:
          type: string
          nullable: true
        medicareRestrictionByTime:
          type: string
          nullable: true
        medicareRestrictionByReferrer:
          type: string
          nullable: true
        medicareRestrictionByLicense:
          type: string
          nullable: true
        medicareRestrictionByOnSiteRadiologist:
          type: string
          nullable: true
        preparationArrivalTime:
          type: string
          nullable: true
        smsContentRules:
          type: string
          nullable: true
        postProcedureInstructions:
          type: string
          nullable: true
